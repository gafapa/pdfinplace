name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Check service worker syntax
        run: npm run check:sw

      - name: Test
        run: npm test

      - name: Check PDF.js resource synchronization
        run: npm run test:pdfjs-resources

      - name: Build
        run: npm run build

      - name: Build test environment
        run: npm run build:test

      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/pdfing-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              npm run test:browser
              exit $?
            fi
            sleep 1
          done
          cat /tmp/pdfing-vite.log
          exit 1
