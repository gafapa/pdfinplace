# Requires Nginx 1.29.3 or later for security-header inheritance.
server {
    listen 8080;
    server_name pdfinplace.com;
    root /srv/sites/pdfinplace.com;
    index index.html;
    charset utf-8;

    add_header_inherit merge;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /__health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ^~ /pdfjs/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ (^|/)\. {
        deny all;
    }
}
